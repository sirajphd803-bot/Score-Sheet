<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Register App</title>
    <!-- PWA Web App Manifest & App Icon Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F5132">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --primary: #0F5132;
            --primary-light: #198754;
            --bg-color: #F4F6F9;
            --card-bg: #FFFFFF;
            --text-dark: #212529;
            --border-color: #E0E0E0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .header {
            background-color: var(--primary);
        }

        .grade-badge {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            background: #E9ECEF;
            display: inline-block;
        }

        /* Toast / Alert Box Styling */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
    </style>
</head>
<body class="p-4 max-w-4xl mx-auto">

    <!-- Header Section -->
    <div class="header text-white p-4 rounded-xl mb-5 shadow-sm flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">Marks Register</h1>
            <p class="text-xs text-green-200 mt-0.5">Class 8, 9 & 10 Marks Entry & Grade Analytics</p>
        </div>
        <span class="bg-green-800 text-xs px-2.5 py-1 rounded-full border border-green-600">Midterm & Term Marks</span>
    </div>

    <!-- Toast Notification Box -->
    <div id="toastContainer"></div>

    <!-- Entry Form Card -->
    <div class="bg-white rounded-xl p-5 mb-5 shadow-sm border border-slate-200">
        <div class="text-base font-bold mb-4 text-[#0F5132] flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            Add Student Record (മാർക്ക് രജിസ്റ്റർ ചെയ്യുക)
        </div>
        <form id="markForm">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 mb-4">
                <div class="flex flex-col">
                    <label for="examTypeSelect" class="text-xs font-semibold mb-1 text-gray-700">Exam Type</label>
                    <select id="examTypeSelect" class="p-2 border border-gray-300 rounded-lg text-sm focus:border-green-600 outline-none">
                        <option value="20">Midterm Exam (Max 20)</option>
                        <option value="40" selected>Term Exam (Max 40)</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="classSelect" class="text-xs font-semibold mb-1 text-gray-700">Class</label>
                    <select id="classSelect" required class="p-2 border border-gray-300 rounded-lg text-sm focus:border-green-600 outline-none">
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="divisionInput" class="text-xs font-semibold mb-1 text-gray-700">Division</label>
                    <input type="text" id="divisionInput" placeholder="e.g. A" required class="p-2 border border-gray-300 rounded-lg text-sm focus:border-green-600 outline-none uppercase">
                </div>

                <div class="flex flex-col">
                    <label for="nameInput" class="text-xs font-semibold mb-1 text-gray-700">Student Name</label>
                    <input type="text" id="nameInput" placeholder="Enter name" required class="p-2 border border-gray-300 rounded-lg text-sm focus:border-green-600 outline-none">
                </div>

                <div class="flex flex-col">
                    <label for="marksInput" id="marksLabel" class="text-xs font-semibold mb-1 text-gray-700">Mark (Max <span id="maxMarkDisplay">40</span>)</label>
                    <input type="number" id="marksInput" min="0" max="40" step="0.5" placeholder="0 - 40" required class="p-2 border border-gray-300 rounded-lg text-sm focus:border-green-600 outline-none">
                </div>
            </div>

            <div class="flex gap-3">
                <button type="submit" class="bg-[#198754] hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition flex-2 flex items-center justify-center gap-1.5 w-full sm:w-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Save Entry
                </button>
                <button type="button" id="pdfBtn" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition flex-1 flex items-center justify-center gap-1.5 w-full sm:w-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Export PDF
                </button>
            </div>
        </form>
    </div>

    <!-- Records Table & PDF Settings -->
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
        <div class="mb-4">
            <label for="pdfTitleInput" class="block text-xs font-semibold mb-1 text-gray-600">Register Title (PDF Title Header):</label>
            <input type="text" id="pdfTitleInput" class="w-full p-2.5 text-sm font-semibold border-2 border-[#198754] rounded-lg text-[#0F5132] focus:outline-none" value="Class Marks Register">
        </div>

        <!-- Filter Controls -->
        <div class="flex flex-wrap gap-3 mb-4 items-center">
            <select id="filterExamType" class="p-2 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700">
                <option value="ALL">All Exam Types</option>
                <option value="20">Midterm (Max 20)</option>
                <option value="40">Term Exam (Max 40)</option>
            </select>

            <select id="filterClassDiv" class="p-2 border border-gray-300 rounded-lg text-xs font-semibold flex-1 min-w-[180px] text-gray-700">
                <option value="ALL">All Classes & Divisions</option>
            </select>

            <select id="sortBy" class="p-2 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700">
                <option value="NAME">Sort: Name (A to Z)</option>
                <option value="MARKS">Sort: Percentage (High to Low)</option>
            </select>
        </div>

        <!-- Marks Table -->
        <div class="overflow-x-auto rounded-lg border border-gray-200">
            <table class="w-full text-sm text-center">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 font-semibold border-b border-gray-200">
                        <th class="p-2.5">Sl. No</th>
                        <th class="p-2.5 text-left">Name</th>
                        <th class="p-2.5">Exam</th>
                        <th class="p-2.5">Mark</th>
                        <th class="p-2.5">Grade</th>
                        <th class="p-2.5">Percentage</th>
                        <th class="p-2.5">Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Dynamic Data Rows -->
                </tbody>
            </table>
        </div>

        <!-- Grade Summary Stats -->
        <div class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-lg">
            <div class="text-xs font-bold text-[#0F5132] uppercase tracking-wider mb-2">Grade Summary (ഗ്രേഡ് വിശകലനം)</div>
            <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-9 gap-2 text-center" id="summaryGrid">
                <!-- Summary Dynamic Cards -->
            </div>
        </div>
    </div>

    <script>
        // Data Store
        let students = JSON.parse(localStorage.getItem("students_data")) || [];

        // DOM Elements
        const markForm = document.getElementById("markForm");
        const examTypeSelect = document.getElementById("examTypeSelect");
        const marksInput = document.getElementById("marksInput");
        const maxMarkDisplay = document.getElementById("maxMarkDisplay");
        const studentTableBody = document.getElementById("studentTableBody");
        const filterClassDiv = document.getElementById("filterClassDiv");
        const filterExamType = document.getElementById("filterExamType");
        const sortBy = document.getElementById("sortBy");
        const pdfBtn = document.getElementById("pdfBtn");
        const summaryGrid = document.getElementById("summaryGrid");

        // Custom Notification Function
        function showNotification(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = `p-3 px-4 rounded-lg text-sm text-white font-medium shadow-lg transition-all transform duration-300 mb-2 ${
                type === "error" ? "bg-red-600" : "bg-green-700"
            }`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Adjust Max Mark Input Limit when Exam Type Changes
        examTypeSelect.addEventListener("change", function () {
            const maxVal = this.value;
            maxMarkDisplay.textContent = maxVal;
            marksInput.max = maxVal;
            marksInput.placeholder = `0 - ${maxVal}`;
        });

        // Grading Engine (Handles both Max 40 and Max 20 Midterm)
        function calculateGrade(cls, mark, maxMark) {
            mark = parseFloat(mark);
            maxMark = parseFloat(maxMark);

            // Scale factor: Max 40 standard vs Max 20 Midterm (Factor 0.5)
            const isMidterm = (maxMark === 20);

            if (cls === "8") {
                // Class 8 Rules: Max 40 thresholds [32, 24, 16, 12]; Max 20 thresholds [16, 12, 8, 6]
                const tA = isMidterm ? 16 : 32;
                const tB = isMidterm ? 12 : 24;
                const tC = isMidterm ? 8  : 16;
                const tD = isMidterm ? 6  : 12;

                if (mark >= tA) return "A";
                if (mark >= tB) return "B";
                if (mark >= tC) return "C";
                if (mark >= tD) return "D";
                return "E";
            } else {
                // Class 9 & 10 Rules: Max 40 thresholds [36, 32, 28, 24, 20, 16, 12, 8]; Max 20 thresholds [18, 16, 14, 12, 10, 8, 6, 4]
                const tAplus = isMidterm ? 18 : 36;
                const tA     = isMidterm ? 16 : 32;
                const tBplus = isMidterm ? 14 : 28;
                const tB     = isMidterm ? 12 : 24;
                const tCplus = isMidterm ? 10 : 20;
                const tC     = isMidterm ? 8  : 16;
                const tDplus = isMidterm ? 6  : 12;
                const tD     = isMidterm ? 4  : 8;

                if (mark >= tAplus) return "A+";
                if (mark >= tA)     return "A";
                if (mark >= tBplus) return "B+";
                if (mark >= tB)     return "B";
                if (mark >= tCplus) return "C+";
                if (mark >= tC)     return "C";
                if (mark >= tDplus) return "D+";
                if (mark >= tD)     return "D";
                return "E";
            }
        }

        // Update Class & Division Filter Dropdown Options
        function updateFilterOptions() {
            const currentValue = filterClassDiv.value;
            filterClassDiv.innerHTML = '<option value="ALL">All Classes & Divisions</option>';

            const uniqueDivisions = [...new Set(students.map(s => `${s.class}-${s.division}`))].sort();

            uniqueDivisions.forEach(item => {
                const [cls, div] = item.split('-');
                const option = document.createElement("option");
                option.value = item;
                option.textContent = `Class ${cls} - ${div}`;
                filterClassDiv.appendChild(option);
            });

            filterClassDiv.value = currentValue;
        }

        // Process Students Array for Filter and Sort
        function getProcessedStudents() {
            const selectedFilter = filterClassDiv.value;
            const selectedExamFilter = filterExamType.value;
            const sortOption = sortBy.value;

            let filtered = students.filter(s => {
                const matchClass = (selectedFilter === "ALL" || `${s.class}-${s.division}` === selectedFilter);
                const matchExam = (selectedExamFilter === "ALL" || String(s.maxMark) === selectedExamFilter);
                return matchClass && matchExam;
            });

            if (sortOption === "NAME") {
                filtered.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
            } else if (sortOption === "MARKS") {
                filtered.sort((a, b) => parseFloat(b.percentageVal) - parseFloat(a.percentageVal));
            }

            return filtered;
        }

        // Calculate Grade Distribution Counts
        function getGradeCounts(studentList) {
            const counts = { "A+": 0, "A": 0, "B+": 0, "B": 0, "C+": 0, "C": 0, "D+": 0, "D": 0, "E": 0 };
            studentList.forEach(s => {
                if (counts[s.grade] !== undefined) {
                    counts[s.grade]++;
                }
            });
            return counts;
        }

        // Handle Add Record Form Submission
        markForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const maxMark = parseInt(examTypeSelect.value, 10);
            const studentClass = document.getElementById("classSelect").value;
            const division = document.getElementById("divisionInput").value.trim().toUpperCase();
            const name = document.getElementById("nameInput").value.trim();
            const marks = parseFloat(document.getElementById("marksInput").value);

            if (marks > maxMark) {
                showNotification(`Mark cannot exceed ${maxMark} for this exam!`, "error");
                return;
            }

            const percNum = ((marks / maxMark) * 100);
            const percentage = percNum.toFixed(1) + "%";
            const grade = calculateGrade(studentClass, marks, maxMark);

            const newStudent = {
                id: Date.now(),
                class: studentClass,
                division: division,
                name: name,
                marks: marks,
                maxMark: maxMark,
                percentageVal: percNum,
                percentage: percentage,
                grade: grade
            };

            students.push(newStudent);
            saveAndRender();

            filterClassDiv.value = `${studentClass}-${division}`;
            renderTable();

            document.getElementById("nameInput").value = "";
            document.getElementById("marksInput").value = "";
            showNotification("Student record added successfully!");
        });

        function saveAndRender() {
            localStorage.setItem("students_data", JSON.stringify(students));
            updateFilterOptions();
            renderTable();
        }

        // Render Web Table and Grade Summary Cards
        function renderTable() {
            studentTableBody.innerHTML = "";
            const currentStudents = getProcessedStudents();

            if (currentStudents.length === 0) {
                studentTableBody.innerHTML = `<tr><td colspan="7" class="p-4 text-gray-500 italic">No records found for current selection.</td></tr>`;
            } else {
                currentStudents.forEach((student, index) => {
                    const row = document.createElement("tr");
                    row.className = "border-b border-gray-100 hover:bg-gray-50 transition";
                    const examLabel = student.maxMark === 20 ? "Midterm (20)" : "Term (40)";
                    
                    row.innerHTML = `
                        <td class="p-2.5 text-gray-600">${index + 1}</td>
                        <td class="p-2.5 text-left font-medium text-gray-800">${student.name} <span class="text-xs text-gray-400">(${student.class}-${student.division})</span></td>
                        <td class="p-2.5"><span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600 border border-gray-200">${examLabel}</span></td>
                        <td class="p-2.5 font-semibold text-gray-700">${student.marks} / ${student.maxMark}</td>
                        <td class="p-2.5"><span class="grade-badge">${student.grade}</span></td>
                        <td class="p-2.5 text-gray-600">${student.percentage}</td>
                        <td class="p-2.5"><button class="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded transition" onclick="deleteStudent(${student.id})">Delete</button></td>
                    `;
                    studentTableBody.appendChild(row);
                });
            }

            // Update Web Grade Summary Cards
            const gradeCounts = getGradeCounts(currentStudents);
            summaryGrid.innerHTML = "";
            
            Object.keys(gradeCounts).forEach(grade => {
                const card = document.createElement("div");
                card.className = "bg-white p-2 rounded-lg border border-gray-200 shadow-2xs";
                card.innerHTML = `<div class="font-bold text-[#198754] text-xs">${grade}</div><div class="text-base font-bold text-gray-800 mt-0.5">${gradeCounts[grade]}</div>`;
                summaryGrid.appendChild(card);
            });
        }

        // Global Delete Handler
        window.deleteStudent = function(id) {
            students = students.filter(s => s.id !== id);
            saveAndRender();
            showNotification("Record deleted", "error");
        };

        filterClassDiv.addEventListener("change", renderTable);
        filterExamType.addEventListener("change", renderTable);
        sortBy.addEventListener("change", renderTable);

        // Export PDF according to Filter and Sort Selection
        pdfBtn.addEventListener("click", function() {
            const currentStudents = getProcessedStudents();

            if (currentStudents.length === 0) {
                showNotification("No records available to export for this selection!", "error");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const customTitle = document.getElementById("pdfTitleInput").value.trim() || "Marks Register";

            doc.setFontSize(14);
            doc.setTextColor(15, 81, 50);
            doc.text(customTitle, 14, 15);

            const pdfData = currentStudents.map((s, index) => [
                index + 1,
                s.name,
                `Class ${s.class}-${s.division}`,
                s.maxMark === 20 ? "Midterm (20)" : "Term (40)",
                `${s.marks}/${s.maxMark}`,
                s.grade,
                s.percentage
            ]);

            // Student Marks Table
            doc.autoTable({
                head: [['Sl. No', 'Name', 'Class & Div', 'Exam', 'Mark', 'Grade', 'Percentage']],
                body: pdfData,
                startY: 22,
                theme: 'grid',
                headStyles: { fillColor: [15, 81, 50] },
                styles: { halign: 'center', fontSize: 9 },
                columnStyles: { 1: { halign: 'left' } }
            });

            // Grade Summary Table at Bottom of PDF
            const gradeCounts = getGradeCounts(currentStudents);
            const summaryHead = Object.keys(gradeCounts);
            const summaryBody = [Object.values(gradeCounts).map(String)];

            let finalY = doc.lastAutoTable.finalY + 12;

            if (finalY + 30 > doc.internal.pageSize.height) {
                doc.addPage();
                finalY = 20;
            }

            doc.setFontSize(11);
            doc.setTextColor(0, 0, 0);
            doc.text("Grade Summary", 14, finalY);

            doc.autoTable({
                head: [summaryHead],
                body: summaryBody,
                startY: finalY + 4,
                theme: 'plain',
                headStyles: { fillColor: [230, 230, 230], textColor: [0, 0, 0], fontStyle: 'bold' },
                styles: { halign: 'center', cellPadding: 3, fontSize: 9, lineColor: [200, 200, 200], lineWidth: 0.1 }
            });

            doc.save(`${customTitle.replace(/[^a-zA-Z0-9]/g, "_")}.pdf`);
            showNotification("PDF generated & downloaded successfully!");
        });

        // Initial Load Actions
        updateFilterOptions();
        renderTable();
    </script>
</body>
</html>
